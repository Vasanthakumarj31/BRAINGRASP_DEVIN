<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Login | BrainyGrasp Partner Program</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/affiliate.css">
</head>
<body class="aff-login-page">

  <div class="aff-login-card">
    <div style="font-size: 2.2rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
      🧠 BrainyGrasp
    </div>
    <h2>Affiliate Partner Portal</h2>
    <p>Sign in to view your referral stats & monthly wallet payouts</p>

    <div id="loginMsg" class="msg-alert"></div>

    <form id="affLoginForm">
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="affiliate@example.com" required>
      </div>

      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btnLogin" class="btn-submit">
        <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
      </button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth(false);

      const form = document.getElementById('affLoginForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        loginAffiliate(email, password);
      });
    });
  </script>
</body>
</html>
