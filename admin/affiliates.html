<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Management — BrainGrasp Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-brain"></i>
        <span>BrainGrasp</span>
      </div>
      <nav>
        <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="index.html"><i class="fas fa-box-open"></i> Products</a>
        <a href="orders.html"><i class="fas fa-receipt"></i> Orders</a>
        <a href="affiliates.html" class="active"><i class="fas fa-user-tie"></i> Affiliates</a>
        <a href="affiliate-payouts.html"><i class="fas fa-hand-holding-usd"></i> Monthly Payouts</a>
        <a href="#" id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <header class="page-header">
        <div>
          <h1>Affiliate Management</h1>
          <p class="page-subtitle" id="affiliateCount">Loading affiliates...</p>
        </div>
        <button id="showAddFormBtn" class="btn-primary">+ Create Affiliate Account</button>
      </header>

      <!-- Add / Edit Affiliate Form Modal -->
      <section id="affiliateFormSection" class="card" style="display:none; margin-bottom:24px;">
        <h2 id="formTitle">Create New Affiliate Account</h2>
        <form id="affiliateForm">
          <input type="hidden" id="editAffiliateId">

          <div class="form-grid">
            <div class="input-group">
              <label>Full Name <span class="req">*</span></label>
              <input type="text" id="f_name" required placeholder="e.g. Ramesh Kumar">
            </div>

            <div class="input-group">
              <label>Email Address <span class="req">*</span></label>
              <input type="email" id="f_email" required placeholder="ramesh@gmail.com">
            </div>

            <div class="input-group" id="pwdGroup">
              <label>Password <span class="req">*</span></label>
              <input type="password" id="f_password" placeholder="••••••••">
            </div>

            <div class="input-group">
              <label>Phone Number</label>
              <input type="tel" id="f_phone" placeholder="9876543210">
            </div>

            <div class="input-group">
              <label>Commission Rate (%) <span class="req">*</span></label>
              <input type="number" id="f_commission" required value="20" min="1" max="100" step="0.5">
            </div>

            <div class="input-group" id="statusGroup" style="display:none;">
              <label>Account Status</label>
              <select id="f_status">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="cancelFormBtn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary" id="submitBtn">💾 Save Affiliate Account</button>
          </div>
        </form>
      </section>

      <!-- Toast Notification -->
      <div id="toast" class="toast"></div>

      <!-- Affiliates List Table -->
      <section class="card">
        <div class="table-toolbar">
          <input type="text" id="searchInput" placeholder="🔍 Search by name, email, or referral code..." class="table-search">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Referral Code</th>
                <th>Commission %</th>
                <th>Clicks</th>
                <th>Sales</th>
                <th>Wallet Balance</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="affiliatesTableBody">
              <tr><td colspan="10" class="loading-row">Loading affiliates...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <style>
    .logo i { font-size: 1.3rem; color: #4f7ef7; }
    .sidebar nav a i { width: 16px; text-align: center; font-size: 13px; }
    .logout-link { color: #ef4444 !important; margin-top: auto; }
    .logout-link:hover { background: rgba(239,68,68,.1) !important; }
    .badge-active { background: rgba(34,197,94,.15); color: #22c55e; padding:3px 8px; border-radius:6px; font-weight:700; font-size:11px; }
    .badge-inactive { background: rgba(239,68,68,.15); color: #ef4444; padding:3px 8px; border-radius:6px; font-weight:700; font-size:11px; }
  </style>

  <script src="js/config.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/affiliates.js"></script>
</body>
</html>
